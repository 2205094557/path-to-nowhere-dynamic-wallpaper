<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050510; }
  #bg-layer { position: fixed; inset: 0; z-index: 0; {{BG_CSS}} }
  #canvas { display: block; width: 100vw; height: 100vh; background: transparent; position: relative; z-index: 1; }
  /* 台词框：预览端同款（半透明黑底白字，底部居中，随音频/文本时长渐隐） */
  #voiceTxt { position: fixed; left: 50%; bottom: 6vh; transform: translateX(-50%); max-width: 78%;
    padding: 8px 18px; border-radius: 10px; background: rgba(0,0,0,.4); color: #fff;
    font-size: max(16px, 1.4vw); line-height: 1.6; text-align: center; letter-spacing: .4px;
    text-shadow: 0 2px 6px rgba(0,0,0,.9); backdrop-filter: blur(6px);
    pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 30;
    font-family: "SourceHanSansCN-Regular", "Microsoft YaHei", sans-serif; }
</style>
</head>
<body>
<div id="bg-layer"></div>
<canvas id="canvas"></canvas>
<div id="voiceTxt"></div>
<script src="live2dcubismcore.min.js"></script>
<script src="wallpaper-layout.js"></script>
<script>window.__L2D_CONFIG = {{L2D_CONFIG_JSON}};</script>
<script>window.__L2D_INIT = { scale: {{SCALE}}, ox: {{OFFSET_X}}, oy: {{OFFSET_Y}}, alignment: "{{ALIGNMENT}}", storageKey: {{LAYOUT_STORAGE_KEY}}, anim: {{ANIMATION}}, track: {{TRACK}}, interact: {{INTERACT}}, voice: {{VOICE}}, subtitle: {{SUBTITLES}}, intro: {{INTRO}} };</script>
<script>window.__L2D_VOICE_LINES = {{VOICE_LINES_JSON}};</script>
<script>window.__L2D_HAS_VOICE_LINES = {{HAS_VOICE_LINES}};</script>
<script>window.__L2D_INTERACT_SEQ = {{INTERACT_SEQ_JSON}};</script>
<script src="live2d-app.js"></script>
</body>
</html>
